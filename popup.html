<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生词本</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 500px;
      min-height: 300px;
      max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .header {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .btn-clear-all {
      padding: 6px 12px;
      background: #f0f0f0;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      color: #666;
      transition: background 0.2s;
    }
    .btn-clear-all:hover {
      background: #e0e0e0;
    }
    .wordbook-container {
      overflow-y: auto;
      max-height: 520px;
      padding: 12px;
    }
    .word-item {
      background: #fff;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      transition: box-shadow 0.2s;
    }
    .word-item:hover {
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .word-title {
      font-weight: 600;
      color: #222;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .word-detail {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .word-detail-label {
      font-weight: 500;
      color: #999;
      display: inline-block;
      width: 50px;
    }
    .word-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
    }
    .word-btn {
      flex: 1;
      padding: 6px;
      background: #f0f0f0;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      color: #666;
      transition: background 0.2s;
    }
    .word-btn:hover {
      background: #e0e0e0;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }
    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }
    .stats {
      padding: 12px 16px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 我的生词本</h1>
    <button class="btn-clear-all" id="clearAllBtn">全部清空</button>
  </div>

  <div class="wordbook-container" id="wordbookContainer">
    <div class="empty-state">
      <div class="empty-state-icon">📖</div>
      <p>暂无保存的词汇</p>
      <p style="font-size: 11px; margin-top: 8px;">划词时点击"保存"来添加</p>
    </div>
  </div>

  <div class="stats">
    <span id="statsText">共 0 个词汇</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
