<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Support — Chinese Slang Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1a56db;
      --blue-dark: #1246b3;
      --blue-light: #e8f0fe;
      --gray-50: #f8f9fa;
      --gray-100: #f1f3f5;
      --gray-200: #e9ecef;
      --gray-400: #868e96;
      --gray-600: #495057;
      --gray-800: #212529;
      --text: #1a1a2e;
      --text-muted: #6c757d;
      --border: #dee2e6;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 10px 30px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background: var(--gray-50);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 24px;
      height: 60px; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-gt { font-size: 14px; font-weight: 700; color: var(--text-muted); letter-spacing: -0.01em; }
    .logo-gt:hover { color: var(--text); }
    .logo-gt span { color: var(--blue); }
    .nav-sep { color: var(--border); font-size: 18px; }
    .nav-product { font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none; }
    .nav-product:hover { color: var(--blue); }
    .nav-current { font-size: 14px; color: var(--text-muted); }
    .nav-right a {
      font-size: 14px; font-weight: 500; color: var(--gray-600);
      text-decoration: none; transition: color .15s;
    }
    .nav-right a:hover { color: var(--text); }

    /* ── Page layout ── */
    .page-wrap { max-width: 600px; margin: 56px auto; padding: 0 24px 96px; }

    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
    .page-header p  { margin-top: 6px; font-size: 15px; color: var(--text-muted); }

    /* ── Form card ── */
    .form-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px;
    }

    .form-group { margin-bottom: 24px; }
    label {
      display: block; font-size: 13px; font-weight: 600;
      margin-bottom: 7px; color: var(--gray-800); letter-spacing: .01em;
    }
    label .hint { font-weight: 400; color: var(--text-muted); font-size: 13px; margin-left: 5px; }

    select, input[type="email"], textarea {
      width: 100%; padding: 10px 13px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 15px; font-family: inherit; color: var(--text);
      background: #fff; transition: border-color .15s, box-shadow .15s;
    }
    select:focus, input[type="email"]:focus, textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
    }
    textarea { resize: vertical; min-height: 130px; }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed var(--gray-200); border-radius: 10px; padding: 22px 16px;
      text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
      background: var(--gray-50);
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--blue); background: var(--blue-light);
    }
    .upload-zone input[type="file"] { display: none; }
    .upload-icon { font-size: 24px; margin-bottom: 6px; }
    .upload-zone .upload-label { font-size: 14px; color: var(--text-muted); }
    .upload-zone .upload-label strong { color: var(--blue); }
    .upload-zone .upload-note { font-size: 12px; color: var(--gray-400); margin-top: 4px; }

    .preview-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .preview-item {
      position: relative; width: 96px; height: 72px;
      border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .preview-item .remove-btn {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px;
      background: rgba(0,0,0,.6); color: #fff;
      border: none; border-radius: 50%;
      font-size: 11px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .preview-item .remove-btn:hover { background: rgba(0,0,0,.85); }

    /* ── Submit ── */
    .btn-submit {
      width: 100%; padding: 13px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 9px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background .15s, opacity .15s;
      letter-spacing: .01em;
    }
    .btn-submit:hover:not(:disabled) { background: var(--blue-dark); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Status messages ── */
    .status {
      padding: 13px 16px; border-radius: 8px;
      font-size: 14px; margin-bottom: 22px; display: none;
    }
    .status.success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .status.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    /* ── Footer ── */
    .site-footer {
      background: var(--gray-800); color: var(--gray-400);
      text-align: center; font-size: 13px; padding: 28px 24px;
      margin-top: 0;
    }
    .site-footer a { color: var(--gray-400); text-decoration: none; }
    .site-footer a:hover { color: #fff; }
    .site-footer .sep { margin: 0 8px; opacity: .4; }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="../" class="logo-gt">Geck<span>tool</span></a>
      <span class="nav-sep">/</span>
      <a href="./" class="nav-product">Chinese Slang Translator</a>
      <span class="nav-sep">/</span>
      <span class="nav-current">Support</span>
    </div>
    <div class="nav-right">
      <a href="./#pricing">Pricing</a>
    </div>
  </div>
</nav>

<div class="page-wrap">

  <div class="page-header">
    <h1>Contact Support</h1>
    <p>We typically respond within 1–2 business days.</p>
  </div>

  <div class="form-card">

    <div id="statusMsg" class="status"></div>

    <form id="supportForm" novalidate>

      <div class="form-group">
        <label for="category">Topic</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Select a topic…</option>
          <option value="Refund request">Refund request</option>
          <option value="Privacy concern">Privacy concern</option>
          <option value="Technical issue">Technical issue</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="reply_to">Your email <span class="hint">— we'll reply here</span></label>
        <input type="email" id="reply_to" name="reply_to" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Describe your issue or question in detail…" required></textarea>
      </div>

      <div class="form-group">
        <label>Screenshots <span class="hint">— up to 3, optional</span></label>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
          <div class="upload-icon">📎</div>
          <div class="upload-label"><strong>Click to upload</strong> or drag &amp; drop</div>
          <div class="upload-note">PNG, JPG, WebP · max 3 images · 3 MB each</div>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Send message</button>

    </form>
  </div>

</div>

<footer class="site-footer">
  © 2026 Gecktool
  <span class="sep">·</span>
  <a href="./">Chinese Slang Translator</a>
  <span class="sep">·</span>
  <a href="./legal.html">Privacy &amp; Terms</a>
  <span class="sep">·</span>
  <a href="./refund.html">Refund Policy</a>
</footer>


<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  // ─── EmailJS credentials ────────────────────────────────────────────────────
  // 1. Sign up at https://www.emailjs.com (free tier: 200 emails/month)
  // 2. Add an Email Service (Gmail / Outlook / custom SMTP) → copy Service ID
  // 3. Create an Email Template (see template vars below) → copy Template ID
  // 4. Copy your Public Key from Account → API Keys
  // 5. (Recommended) Restrict allowed origins in EmailJS dashboard to gecktool.com
  const EMAILJS_PUBLIC_KEY  = 'tzyNGNlnApT8yTtQt';   // e.g. 'abc123XYZ'
  const EMAILJS_SERVICE_ID  = 'service_gy2m8ve';   // e.g. 'service_xxxxxx'
  const EMAILJS_TEMPLATE_ID = 'template_bcmskta';  // e.g. 'template_xxxxxx'
  //
  // EmailJS template should use these variables:
  //   {{category}}    — selected topic
  //   {{reply_to}}    — user's email (set as Reply-To in template)
  //   {{message}}     — message body
  //   {{screenshot1}} — base64 data URI of image 1 (may be empty)
  //   {{screenshot2}} — base64 data URI of image 2 (may be empty)
  //   {{screenshot3}} — base64 data URI of image 3 (may be empty)
  //
  // Suggested HTML template body:
  //   <p><strong>Topic:</strong> {{category}}</p>
  //   <p><strong>From:</strong> {{reply_to}}</p>
  //   <p><strong>Message:</strong><br>{{message}}</p>
  //   {{#if screenshot1}}<p><strong>Screenshot 1:</strong><br><img src="{{screenshot1}}" style="max-width:560px"></p>{{/if}}
  //   {{#if screenshot2}}<p><strong>Screenshot 2:</strong><br><img src="{{screenshot2}}" style="max-width:560px"></p>{{/if}}
  //   {{#if screenshot3}}<p><strong>Screenshot 3:</strong><br><img src="{{screenshot3}}" style="max-width:560px"></p>{{/if}}
  // ────────────────────────────────────────────────────────────────────────────

  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  const MAX_FILES = 3;
  const MAX_BYTES = 3 * 1024 * 1024; // 3 MB per file
  let selectedFiles = []; // Array of File objects

  // ── Drag & drop + click upload ───────────────────────────────────────────────
  const uploadZone = document.getElementById('uploadZone');
  const fileInput  = document.getElementById('fileInput');
  const previewGrid = document.getElementById('previewGrid');

  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    addFiles(Array.from(e.dataTransfer.files));
  });
  fileInput.addEventListener('change', () => {
    addFiles(Array.from(fileInput.files));
    fileInput.value = ''; // reset so same file can be re-added
  });

  function addFiles(incoming) {
    const slots = MAX_FILES - selectedFiles.length;
    if (slots <= 0) return showStatus('Maximum 3 screenshots allowed.', 'error', true);
    incoming = incoming.slice(0, slots);
    for (const f of incoming) {
      if (!f.type.startsWith('image/')) { showStatus(`"${f.name}" is not an image.`, 'error', true); continue; }
      if (f.size > MAX_BYTES) { showStatus(`"${f.name}" exceeds 3 MB.`, 'error', true); continue; }
      selectedFiles.push(f);
    }
    renderPreviews();
  }

  function removeFile(idx) {
    selectedFiles.splice(idx, 1);
    renderPreviews();
  }

  function renderPreviews() {
    previewGrid.innerHTML = '';
    selectedFiles.forEach((f, i) => {
      const url = URL.createObjectURL(f);
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.innerHTML = `<img src="${url}" alt="screenshot ${i+1}"><button class="remove-btn" type="button" title="Remove">✕</button>`;
      item.querySelector('.remove-btn').addEventListener('click', () => removeFile(i));
      previewGrid.appendChild(item);
    });
  }

  // ── File → compressed base64 JPEG ───────────────────────────────────────────
  // EmailJS variables cap is 50 KB total. We resize each image to ≤600px wide
  // and encode as JPEG at quality 0.4, keeping each image ~8–15 KB as base64.
  function compressImage(file, maxWidth = 600, quality = 0.4) {
    return new Promise((resolve) => {
      const img = new Image();
      const blobUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(blobUrl);
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(img.width  * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(blobUrl); resolve(''); };
      img.src = blobUrl;
    });
  }

  // ── Form submit ──────────────────────────────────────────────────────────────
  const form      = document.getElementById('supportForm');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearStatus();

    const category = document.getElementById('category').value;
    const reply_to = document.getElementById('reply_to').value.trim();
    const message  = document.getElementById('message').value.trim();

    if (!category) return showStatus('Please select a topic.', 'error');
    if (!reply_to) return showStatus('Please enter your email address.', 'error');
    if (!isValidEmail(reply_to)) return showStatus('Please enter a valid email address.', 'error');
    if (!message)  return showStatus('Please enter a message.', 'error');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    try {
      // Compress screenshots before sending (keeps total payload under EmailJS 50 KB limit)
      const screenshots = await Promise.all(selectedFiles.map(f => compressImage(f)));

      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        category,
        reply_to,
        message,
        screenshot1: screenshots[0] || '',
        screenshot2: screenshots[1] || '',
        screenshot3: screenshots[2] || '',
      });

      // Success: reset form
      form.reset();
      selectedFiles = [];
      renderPreviews();
      showStatus('✓ Your message has been sent. We\'ll reply to ' + reply_to + ' within 1–2 business days.', 'success');
    } catch (err) {
      console.error('[Support] EmailJS error:', err);
      const detail = err?.text || err?.message || JSON.stringify(err);
      showStatus('Something went wrong: ' + detail, 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send message';
    }
  });

  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  function showStatus(msg, type, temporary = false) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status ' + type;
    el.style.display = 'block';
    if (temporary) setTimeout(() => { el.style.display = 'none'; }, 4000);
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function clearStatus() {
    const el = document.getElementById('statusMsg');
    el.style.display = 'none';
  }
</script>

</body>
</html>
