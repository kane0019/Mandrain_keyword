name: Deploy Lambda

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/src/**'
      - 'backend/package.json'
      - 'backend/cfn-lambda.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '20'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Build Lambda packages
        working-directory: backend
        run: npm run build

      - name: Zip packages
        working-directory: backend
        run: |
          cd dist/session-init && zip -r ../session-init.zip index.mjs && cd ../..
          cd dist/analyze && zip -r ../analyze.zip index.mjs && cd ../..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set S3 bucket name
        id: bucket
        run: |
          if [ "${{ steps.env.outputs.environment }}" = "prod" ]; then
            echo "name=${{ vars.LAMBDA_BUCKET_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ vars.LAMBDA_BUCKET_DEV }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to S3
        id: upload
        working-directory: backend/dist
        run: |
          VERSION="${{ github.sha }}"
          SHORT_SHA="${VERSION:0:7}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          S3_PREFIX="${TIMESTAMP}-${SHORT_SHA}"

          echo "s3_prefix=${S3_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "Uploading to s3://${{ steps.bucket.outputs.name }}/"

          # Upload versioned packages
          aws s3 cp session-init.zip "s3://${{ steps.bucket.outputs.name }}/session-init/${S3_PREFIX}.zip"
          aws s3 cp analyze.zip "s3://${{ steps.bucket.outputs.name }}/analyze/${S3_PREFIX}.zip"

          # Upload as latest
          aws s3 cp session-init.zip "s3://${{ steps.bucket.outputs.name }}/session-init/latest.zip"
          aws s3 cp analyze.zip "s3://${{ steps.bucket.outputs.name }}/analyze/latest.zip"

      - name: Deploy Lambda CloudFormation stack
        id: deploy
        working-directory: backend
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          STACK_NAME="mandrain-lambda-${ENV}"
          S3_PREFIX="${{ steps.upload.outputs.s3_prefix }}"

          echo "Deploying stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file cfn-lambda.yaml \
            --stack-name "${STACK_NAME}" \
            --parameter-overrides \
              EnvironmentName="${ENV}" \
              SessionInitS3Key="session-init/${S3_PREFIX}.zip" \
              AnalyzeS3Key="analyze/${S3_PREFIX}.zip" \
              JwtSecretArn="${{ secrets.JWT_SECRET_ARN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Summary
        run: |
          S3_PREFIX="${{ steps.upload.outputs.s3_prefix }}"
          echo "### Deploy Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ steps.env.outputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stack | mandrain-lambda-${{ steps.env.outputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bucket | ${{ steps.bucket.outputs.name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| S3 Key Prefix | ${S3_PREFIX} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| session-init | session-init/${S3_PREFIX}.zip |" >> "$GITHUB_STEP_SUMMARY"
          echo "| analyze | analyze/${S3_PREFIX}.zip |" >> "$GITHUB_STEP_SUMMARY"
