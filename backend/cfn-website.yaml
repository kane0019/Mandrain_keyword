AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Mandrain Keyword - Static Website S3 Stack
  S3 bucket configured for public static website hosting.
  Deploy this stack before running the deploy-website GitHub Actions workflow.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

Resources:

  # ========== S3 Website Bucket ==========
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'mandrain-website-${EnvironmentName}'
      # Must disable Block Public Access before a bucket policy can grant public read
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      Tags:
        - Key: Project
          Value: mandrain-keyword
        - Key: Environment
          Value: !Ref EnvironmentName

  # ========== Public Read Policy ==========
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'

  # ========== Apex Domain Redirect Bucket ==========
  # Redirects gecktool.com (no-www) → www.gecktool.com so Google has one canonical URL.
  # NOTE: S3 website hosting is HTTP-only. For HTTPS redirect (required for SEO), point the
  # apex domain DNS to a CloudFront distribution that has a Function/Lambda@Edge doing the
  # 301 redirect, then alias this bucket only as a fallback HTTP endpoint.
  ApexRedirectBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'mandrain-apex-redirect-${EnvironmentName}'
      WebsiteConfiguration:
        RedirectAllRequestsTo:
          HostName: www.gecktool.com
          Protocol: https
      Tags:
        - Key: Project
          Value: mandrain-keyword
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  BucketName:
    Description: S3 bucket name - set this as WEBSITE_BUCKET_DEV (or PROD) in GitHub Actions variables
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub 'mandrain-website-bucket-${EnvironmentName}'

  WebsiteURL:
    Description: S3 static website endpoint URL
    Value: !GetAtt WebsiteBucket.WebsiteURL
    Export:
      Name: !Sub 'mandrain-website-url-${EnvironmentName}'

  ApexRedirectURL:
    Description: >
      S3 website endpoint for the apex redirect bucket. Point the gecktool.com (no-www)
      DNS A/ALIAS record to a CloudFront distribution fronting this bucket to get HTTPS redirects.
    Value: !GetAtt ApexRedirectBucket.WebsiteURL
    Export:
      Name: !Sub 'mandrain-apex-redirect-url-${EnvironmentName}'
