AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Mandrain Keyword - Secrets Manager Stack
  JWT signing secret for Lambda functions.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

Resources:
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'mandrain-jwt-secret-${EnvironmentName}'
      Description: JWT signing secret for Mandrain Keyword extension
      SecretString: 'password'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  LsWebhookSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'mandrain-ls-webhook-secret-${EnvironmentName}'
      Description: Lemon Squeezy webhook signing secret for HMAC-SHA256 verification
      SecretString: 'PLACEHOLDER_LS_SIGNING_SECRET'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  JwtSecretArn:
    Description: JWT Secret ARN
    Value: !Ref JwtSecret
    Export:
      Name: !Sub 'mandrain-${EnvironmentName}-JwtSecretArn'

  JwtSecretName:
    Description: JWT Secret Name
    Value: !Sub 'mandrain-jwt-secret-${EnvironmentName}'

  LsWebhookSecretArn:
    Description: Lemon Squeezy webhook signing secret ARN
    Value: !Ref LsWebhookSigningSecret
    Export:
      Name: !Sub 'mandrain-${EnvironmentName}-LsWebhookSecretArn'

  LsWebhookSecretName:
    Description: Lemon Squeezy webhook signing secret name
    Value: !Sub 'mandrain-ls-webhook-secret-${EnvironmentName}'
