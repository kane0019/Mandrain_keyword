AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Mandrain Keyword - Secrets Manager Stack
  JWT signing secret for Lambda functions.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

Resources:
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'mandrain-jwt-secret-${EnvironmentName}'
      Description: JWT signing secret for Mandrain Keyword extension
      SecretString: 'password'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  JwtSecretArn:
    Description: JWT Secret ARN
    Value: !Ref JwtSecret
    Export:
      Name: !Sub 'mandrain-${EnvironmentName}-JwtSecretArn'

  JwtSecretName:
    Description: JWT Secret Name
    Value: !Sub 'mandrain-jwt-secret-${EnvironmentName}'
