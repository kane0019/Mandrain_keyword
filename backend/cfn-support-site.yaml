AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Mandrain Keyword - Support Site Stack
  Public S3 bucket for the static customer support page.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name

Resources:
  # ========== S3 Bucket — Public Static Website ==========
  SupportSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'mandrain-support-${AWS::AccountId}-${EnvironmentName}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: customer-support-site

  SupportSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SupportSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${SupportSiteBucket.Arn}/*'

Outputs:
  SupportSiteBucketName:
    Description: S3 bucket name for the support site
    Value: !Ref SupportSiteBucket
    Export:
      Name: !Sub 'mandrain-support-bucket-${EnvironmentName}'

  SupportSiteURL:
    Description: Public URL of the support site
    Value: !GetAtt SupportSiteBucket.WebsiteURL
    Export:
      Name: !Sub 'mandrain-support-url-${EnvironmentName}'
